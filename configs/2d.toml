# 2D single-view. Everything shared lives in base.toml (layered over automatically); THIS FILE
# IS THE DIFFERENCE -- and it is empty of [data] overrides on purpose: 3d.toml's three keys are
# camera-count questions a one-camera root cannot ask.
#
# The deployment recipe lives in `scripts/infer.py`, not config:
#   --anchor carry --overlap 8 --crop-source boxes
# (`--crop-source boxes` is the one flag that differs from 3D; a 2D detector is trained without
# `--keypoints`, since its only payoff is that flag.)
#
# Two shared defaults are measured differently in 2D, so do not read the shared default as a
# shared result: `--anchor carry` is HARMFUL here (the loop saturates rather than diverges -- use
# `--anchor none` for a long 2D run), and `--overlap 8` is 3D's optimum, not 2D's (still improving
# at 12).
#
# `[model].gridresid_offset` is inherited and inert in 2D but still required -- it asserts what
# the weights were trained as, not what this run does.
