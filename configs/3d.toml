# 3D, multiview or single-view. Everything shared lives in base.toml; THIS FILE IS THE DIFFERENCE
# -- three keys, all one fact: a 3D session has more than one camera, so it has a camera count to
# sample and a triangulation to fall back on.
#
# The deployment recipe lives in `scripts/infer.py`, not config:
#   --anchor carry --overlap 8 --crop-source keypoints
# (needs a detector trained WITH `--keypoints`; measured worth -0.45 mm in 3D, refuted in 2D,
# where single-keypoint frames floor the box at min_crop_dim).

extends = "base.toml"

[data]
# 0 -> every camera of a 3D session; the pretrained tracker was trained at [1, 8], so a fixed higher count is out of distribution as well as slow.
cams_to_sample = 0
val_cams_to_sample = 5      # the reference's [dataset.val] value
# Rate at which a 3D session is shown a SINGLE camera; 0 turns the 3D-single-view path off -- with no triangulation a non-query point has nothing to predict.
prob_2d_only = 0
