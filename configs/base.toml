# Everything 2D and 3D agree on. Not runnable alone -- `configs/2d.toml` and `configs/3d.toml`
# each `extends` this and add the few keys that genuinely differ.
#
# THE POINT OF THE SPLIT IS THAT THE OVERLAY IS THE WHOLE DIFFERENCE. If a key belongs here and is
# repeated in an overlay, the overlay stops being readable as "what 3D needs that 2D does not",
# which is the one question this layout exists to answer. Three keys differ. See the overlays.
#
# [model] below the `query` line is the ukt14i7c base recipe -- it is splatted into posetail's
# TrackerEncoder and the warm start expects the same architecture it was trained with.
# `n_keypoints` is NOT here: it is derived from the keypoint registry, which is derived from data.

[data]
n_frames = 12               # a CEILING: a train window is sized to the labelled span it covers
                            # MUST EQUAL [model].stride_length -- see build_model. 24 -> 12 halves
                            # what inference must hold: one window of FULL frames across the refine
                            # pass is the irreducible working set, and on a 16-camera 3208x2200 rig
                            # that is 8.13 GB at 24 against 4.07 at 12.
image_size = 256
balance_datasets = true
aug_prob = 0.25
crop_jitter = 0.3           # 0.3/0.3 cut the cost of detector crops from +0.545 to +0.115 mm
crop_jitter_scale = 0.3     # AND improved base accuracy -- a tight box teaches the model that
min_crop_dim = 64           # the animal always fills the frame, which no detector delivers
prompt_dropout = 0.5        # fraction of STEPS run fully query-free -> no-query tokens
prompt_noise_px = 2.5       # sigma on the prior, in PIXELS. 3D converts via cube_scale (world
                            # units per pixel), so ONE setting means the same visual displacement
                            # on a 30 px fly and on allen's mm-space rig. Ships WITH the dropout --
                            # dropout alone is retired at +0.146 SIG worse on fly.
# A WHOLE-BODY offset, the corruption with the shape of a deployment failure (i.i.d. jitter
# averages to zero over the keypoint set and so teaches the model to trust the prior's centroid
# exactly -- the one quantity a whole-body lag gets wrong).
#
# 5.0 IS A CONSISTENCY CHOICE, NOT A MEASURED OPTIMUM. The measured value is 8.0, on allen, 3D
# (prompted-self 2.3275 against 2.5254, -0.277 mm [-0.395, -0.171] paired; report 13 step 6). 2D was
# proposed at 0.0 only because the key acts through `scene_center` and `cube_scale`, which are
# 3D-derived, so report 17 section 7 argues it is UNMEASURABLE in 2D -- not that it is harmful
# there. 5 buys one fewer knob that differs between the two files. The cost: a new 3D arm is no
# longer paired with the 8.0 result on record, so say so when reporting one.
prompt_offset_px = 5.0
num_workers = 12

[model]
query = "prior"             # "prior" (per-keypoint prior + no-query tokens) | "none" (query-free)
query_encoder = "wide"      # the only encoder; the two query terms are built iff query = "prior"
# THE BOX PROMPT (report 27): tell the model which box the target animal occupies, per frame per
# camera, as a NON-position channel -- it can then be told which animal to return. "none" |
# "film" (FiLM on the identity term). "none" is byte-identical to a config without the key.
# Measured on crowded 2D calms21:
# -3.5 mm MPJPE held-out at fixed weights, and in the deployment window loop on WIDE crops
# (--crop-inflate 1.5) +0.26 MOTA / -0.117 fp_dup -- it removes the report-24 §9m wide-crop
# collapse. ROOT-CONDITIONAL by keypoint density (sparse rat-city helps far less) and
# GEOMETRY-CONDITIONAL (decisive on a shared/wide crop, redundant on one already centred on its
# target). Deploy with `scripts/infer.py` -- the box DEPLOYMENT recipe (--box-prompt detector
# --crop-inflate 1.5 --refine) is now the DEFAULT for a box model and inert for a plain one, so
# no flags are needed. "film" is the shipped default; "none" restores a plain wide model.
#
# LIVE IN 2D AND 3D, PER CAMERA (report 33). This used to be 2D-single-camera-only -- the
# training loader always emitted a correct per-camera 3D box, but `infer.py` refused to consume
# it on any 3D or multi-camera window and ran box-withheld there, silently, on every 3D box run
# ever trained. A camera with nothing finite that frame gets a NaN column, substituted by the
# encoder's learned no-box token -- the regime `[data].box_prompt_dropout` trains, not a silent
# failure. `[data].crop_inflate` is the loader twin of `--crop-inflate`: 1.0 is inert, and no
# shipped config trains above it yet.
box_prompt = "film"
# What the 3D residual is an offset FROM. NO DEFAULT -- the two values load the same tensors, so a
# checkpoint trained under one and built under the other produces numbers instead of an exception
# (+23.1 mm MPJPE, -0.18 MOTA on 3dpop; gotcha 12). Inert in 2D, where `model.py` returns before
# both offset paths -- but still required, because the key is about the WEIGHTS, not the run.
# "triangulated" is REFUTED when paired with query = "prior": +0.289 mm [+0.115, +0.473] worse.
gridresid_offset = "query"

video_encoder_version = "large"
# STAGED UNFREEZE, and the ONLY statement about the encoder's gradient state -- `[training]`'s
# `freeze_encoder` is gone, because it re-froze the encoder after `build_model` and two sources of
# truth for one fact is one config away from silently disagreeing (the `per_camera_cube_scale`
# rule). A bool means never / from step 0; an INT is the iteration to unfreeze at, and posetail
# 0.3.5's `TrackerEncoder.unfreeze_video_encoder` owns the gate and the block selection.
#
# NOT MEASURED ON THIS REPO'S ROOTS. Every run on record trained with the encoder frozen for its
# whole life, so no number in CLAUDE.md is comparable to a run started after this default landed.
# Set `video_encoder_requires_grad = false` to reproduce the old arm exactly.
video_encoder_requires_grad = 10000
# The last 8 of ViT-L's 24 blocks, plus (repo-local, not upstream) the hierarchical output norms
# whose layer falls in that range -- `norms_block[3]` at layer 23 here. Upstream unfreezes blocks
# and an `encoder.norm` that VJEPA 2.1 does not have, so the norm feeding the decoder off a
# trainable block would otherwise stay frozen. Omit the key to train the WHOLE encoder.
video_encoder_finetune_last_n_layers = 8
video_encoder_hierarchical = true
soft_argmax_temperature_learnable = true
stride_length = 12          # THE SAME QUANTITY as [data].n_frames -- it sizes the temporal
                            # pos_embed (tracker_encoder: self.S = self.n_frames = stride_length).
                            # build_model refuses a config where the two disagree.
image_size = 256
query_patch_size = 9
per_camera_cube_scale = true
max_freq = 10
embedding_dim = 256
principal_point_embedding = true
intrinsic_embedding = true
metric_ray_translation = true
latent_dim = 512
n_heads = 8
n_time_space_blocks = 6
embedding_factor = 4
use_camera_self_attention = true
use_temporal_self_attention = true
f_eff_scale = true
scene_encoder_proj = true
scene_proj_dim = 512
scene_proj_prenorm = false
scene_proj_mlp = false
scene_pos_embed_mode = "ropepos"
rope_base = 100.0
time_embed_mode = "fourier_rel"
output_mode = "gridresid"
head_3d_grid_size = 1024
head_3d_grid_radius = 1.8
log_3d_output = true
log_3d_eps = 0.1
# LOAD-BEARING, do not widen. `_grid_softmax` masks to |argmax - index| <= 60 of 1024 bins. Swept
# against labels: 10/20/30/45/60/120/inf read 8.114/8.032/7.991/7.981/7.976/8.374/11.032 mm --
# removing the truncation costs +3.06 mm (38%). It suppresses spurious far modes; it is not a bias.
soft_argmax_threshold = 60
# "head" averages convex-spaced bin centres directly and overshoots through the warp at large
# motion; "warped" averages in the uniform space first. The library defaults to the wrong one.
grid_decode_space = "warped"
enable_subpixel_refinement = false
depth_log_min = -2.5
depth_log_max = 2.5

# Five keys that used to be here and reach nothing, removed rather than left reading as knobs:
#   corr_radius, use_volume_embedding, occlusion_embedding -- consumed only by the stock
#     QueryEncoder, which model.py no longer builds
#   mode_3d      -- "stored and never read" (build_model only asserts it)
#   cross_attn_dim -- restated latent_dim, which is also what None defaults to
# The parameter set is identical without them (measured).

[training]
n_iterations = 60000
seed = 23
# The base tracker this finetunes from. Moving-camera support added ZERO parameters, so a
# checkpoint from before that merge loads cleanly; the unexpected-keys list is printed anyway.
checkpoint_path = "/groups/karashchuk/home/karashchukl/results/posetail-finetuning-v3/wandb/run-20260727_113457-ukt14i7c/files/checkpoints"
max_grad_norm = 10.0
checkpoint_freq = 1000
val_freq = 200
val_batches = 20
print_freq = 20
# `freeze_encoder` REMOVED -- see [model].video_encoder_requires_grad, which is now the only
# statement about the encoder's gradient state. A config still naming it is refused by name.

[training.optimizer]
# THE SHIPPED OPTIMIZER, and also what an ABSENT key means. "muon" runs torch.optim.Muon on the
# 2D transformer matrices of the decoder (and the encoder blocks, when unfrozen) with AdamW-SF on
# everything else -- heads, norms, biases, and every nn.Embedding, whose rows are keypoint
# identities and must not be orthogonalized together. Ported from posetail-next, where SF-Muon
# beat AdamW/schedulefree by ~0.05 kubric at every matched iteration; NOT re-measured on this
# repo's roots, so it is the reference's result and not one of ours (dev/reports/34).
#
# "schedulefree" restores the previous AdamW-SF recipe and is what an EXISTING run folder needs in
# order to resume -- its checkpoint carries AdamW-SF state, and train.py refuses to load it into a
# Muon optimizer rather than guessing.
optimizer = "muon"
learning_rate = 1e-4        # the value every run on record used
kpt_lr = 5e-4               # fresh params (identity table, no-query tokens, gate) learn faster
# LIVE from the unfreeze iteration, not inert: before it the encoder groups do not exist, and at
# the unfreeze they are created at this scale (1e-5). The AdamW half of them warms up over
# `warmup_steps` from its own k = 0 because a new group starts fresh; the Muon half is long past
# `muon_warmup_steps` by then and joins at full scaled LR, matching the reference.
encoder_lr_scale = 0.1
weight_decay = 0.002
warmup_steps = 500          # drives the AdamW-SF half's warmup
beta1 = 0.9
beta2 = 0.95
muon_schedulefree = true    # ScheduleFreeWrapper on top of Muon -- the reference's winning arm
muon_lr_scale = 1.0         # adjust_lr_fn = "match_rms_adamw" makes Muon REUSE the AdamW lr
muon_momentum = 0.95
muon_warmup_steps = 500     # Muon hits full lr at step 0 otherwise; matches warmup_steps
muon_adjust_lr_fn = "match_rms_adamw"

[training.losses]
# `delta` and `use_huber_loss` reach the 3D metric Hubers only -- the 2D and all four reprojection
# losses hardcode delta = 16 and Huber on.
delta = 6
use_huber_loss = true
# THE ONLY FIVE `TotalLoss` ITSELF FIRES ON A 2D SESSION. `TotalLoss.forward` branches on
# coords_true.shape[-1], and the R == 2 block computes exactly these; everything else below is
# NaN'd and dropped -- see vis_loss_weight for the visibility consequence of that.
coords_loss_2d_weight = 1.5
coords_softmax_2d_weight = 0.6
smoothness_loss_2d_weight = 0.5
smoothness_loss_order = 4   # a CEILING: train.py clamps to min(order, T-1) per batch, and the
smoothness_loss_tolerance = 1.5   # derived-T rule makes T = 2 common, i.e. order 1.
# A REPO-LOCAL TERM, not `TotalLoss`'s (`tailcyclenet/losses.py::PoseLoss`), and the ONLY key in
# this block that fires on a 2D session and NOT on a 3D one -- the opposite scope of every key
# below it. `TotalLoss.forward` never computes 2D visibility at all (see vis_loss_weight), so this
# is the only way a `missing` row on a 2D session reaches the vis_pred head as a supervised
# occlusion. DEFAULT 0.0 SO AN ABSENT KEY IS BIT-IDENTICAL to a run without this file's change --
# every run on record trained at 0. Ship above 0 only after a paired arm on allen-mouse-annotated,
# the one root with a dense, honest 2D occlusion channel (41.9% `missing`); rat-city-annotated and
# calms21 must not be used to judge or gate this head (dev/plans/status_consistency_and_occlusion.md).
vis_loss_2d_weight = 0.0
# 3D-only from here down.
#
# NOTHING IN `TotalLoss` ITSELF SUPERVISES VISIBILITY ON A 2D SESSION. Both of ITS vis terms live
# inside losses.py's 3D `else` branch, so on a 2D-only root the vis_pred head gets no gradient
# from THIS weight -- and `--vis-thresh` there was gating on an untrained head until
# `vis_loss_2d_weight` above existed. That is the real reason the rat-city gate figure was
# withdrawn and the calms21 one is negative, and it is why this weight looks larger than it acts.
vis_loss_weight = 5.0
vis_loss_3d_weight = 1.0
conf_loss_weight = 0.0            # documented off-switches: the terms exist, the weights are 0
conf_2d_loss_weight = 0.0
coords_loss_rays_weight = 0.0     # supervises the unnormalised weighted SUM; see model.py:360
occluded_coords_loss_weight = 0.1
coords_loss_weight = 0.1
coords_loss_direct_weight = 0.1   # applied TWICE (cams_direct and direct), so effectively 0.2
coords_loss_triangulate_weight = 0.1
coords_loss_depth_weight = 0.5
coords_loss_direct_reproj_weight = 1.0
coords_loss_rays_reproj_weight = 0.05
coords_loss_triangulate_reproj_weight = 2.0
coords_softmax_3d_weight = 0.4
depth_softmax_weight = 1.5        # the largest CE term, and query-INDEPENDENT
coords_3d_loss_scale = 50.0
smoothness_loss_3d_weight = 0.5

# Three keys that used to be here and reach nothing:
#   gamma, feature_loss_weight -- both gate on outputs TrackerEncoder never emits
#     (`coords_pred_iters` survives only as a comment at tracker_encoder.py:830;
#      `feature_planes_levels` does not appear in that file at all)
#   pixel_thresh -- feeds only the two conf losses, which are weighted 0

[wandb]
project_name = "tailcyclenet"
path = "/groups/karashchuk/home/karashchukl/results/tailcyclenet"
mode = "offline"
