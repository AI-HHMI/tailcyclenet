# 3D-POP: pigeons, 4 calibrated cameras, up to 10 birds per sequence.
#
# `names` is transcribed directly from pose3d.npz['keypoints'], re-asserted by `check_npz` on
# every load, so this file cannot drift from the data.
#
# bp1-bp4 and hd1-hd4 are backpack/head markers with no recoverable left-right correspondence, so
# `flip_pairs` and `skeleton` are left EMPTY rather than partially filled -- a partial bilateral
# map would silently mislabel the markers it omits.
name = "3dpop"
mode = "3d"
units = "mm"
# The association gate, in pixels; 30.0 matches the 2026-09-05 data edit to every 3dpop session.toml (swept on Seq59).
assoc_res_max_px = 30.0

names = [
  "bp1", "bp2", "bp3",
  "bp4", "bp_bottomKeel", "bp_leftShoulder",
  "bp_rightShoulder", "bp_tail", "bp_topKeel",
  "hd1", "hd2", "hd3",
  "hd4", "hd_beak", "hd_leftEye",
  "hd_nose", "hd_rightEye",
]

skeleton = []
flip_pairs = []

# Measured from the best checkpoint of this dataset's longest run. See DatasetSpec.
