# allen-mouse: 47 keypoints, one animal, 7 calibrated cameras.
#
# The authoritative list is `kpt_names.ALLEN_KEYPOINTS`; `dataset_spec.allen_spec()` asserts this
# file agrees with it, so kpt_names.py's import-time transposition checks stay live.
#
# npz_column_sorted repairs the upstream writer bug: pose3d.npz stores `pose` COLUMN-sorted and
# `keypoints` NAME-sorted, which transposes all 8 `X` / `X-base` pairs (16 positions). Full
# derivation and the 8/8 anatomical confirmation are in kpt_names.py.
name = "allen-mouse"
mode = "3d"
units = "mm"
max_instances = 1
npz_column_sorted = true
holdout_sessions = ["769890"]
min_crop_dim = 64

names = [
  "L-ear", "LF-elbow", "LF-index", "LF-index-base",
  "LF-middle", "LF-pinkie", "LF-pinkie-base", "LF-ring",
  "LF-shoulder", "LF-wrist", "LH-hip", "LH-index",
  "LH-knee", "LH-middle", "LH-pinkie", "LH-pinkie-base",
  "LH-ring", "LH-thumb", "LH-thumb-base", "LH-wrist",
