# branson-fly: 9 flies, ONE camera, 21 keypoints, 1024x1024 frames.
#
# >>> NAMES ARE PROVISIONAL. <<<
# There is no branson-fly module in posetail-preprocessing (only a comment in
# generate_processed_dataset_animal.py noting that ChimpACT "mirrors branson-fly"), the npz carries
# no `keypoints` array, and no older dataset version has one either. Rather than invent 21 fly
# landmark names, these are positional placeholders and `names_provisional = true`.
#
# What that costs, precisely:
#   - training is UNAFFECTED. The embedding table is indexed positionally regardless of the names.
#   - flip augmentation and any per-keypoint report WOULD be wrong, so the spec refuses to define
#     `flip_pairs` or `skeleton` while this flag is set.
#   - `names_provisional` is inside `spec.sha`, so replacing these with sourced names invalidates
#     checkpoints trained against them rather than silently relabelling their per-keypoint tables.
name = "branson-fly"
mode = "2d"
units = "px"
names_provisional = true
max_instances = 10
image_wh = [1024, 1024]
holdout_sessions = []
min_crop_dim = 64

names = [
  "kp00", "kp01", "kp02", "kp03", "kp04", "kp05", "kp06",
  "kp07", "kp08", "kp09", "kp10", "kp11", "kp12", "kp13",
  "kp14", "kp15", "kp16", "kp17", "kp18", "kp19", "kp20",
]

skeleton = []
flip_pairs = []

# Measured from the best checkpoint of this dataset's longest run. See DatasetSpec.
default_iterations = 60000
iterations_is_floor = true
