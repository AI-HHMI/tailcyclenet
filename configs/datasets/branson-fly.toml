# branson-fly: 9 flies, ONE camera, 21 keypoints, 1024x1024 frames.
#
# NAMES ARE PROVISIONAL: no branson-fly module exists in posetail-preprocessing and the npz
# carries no `keypoints` array, so these are positional placeholders. Training is unaffected
# (the embedding table is positional); `flip_pairs`/`skeleton` are refused while the flag is
# set; and `names_provisional` sits inside `spec.sha`, so replacing the names invalidates
# checkpoints rather than silently relabelling them.
name = "branson-fly"
mode = "2d"
units = "px"
names_provisional = true
image_wh = [1024, 1024]
names = [
  "kp00", "kp01", "kp02", "kp03", "kp04", "kp05", "kp06",
  "kp07", "kp08", "kp09", "kp10", "kp11", "kp12", "kp13",
  "kp14", "kp15", "kp16", "kp17", "kp18", "kp19", "kp20",
]

skeleton = []
flip_pairs = []

# Measured from the best checkpoint of this dataset's longest run. See DatasetSpec.
