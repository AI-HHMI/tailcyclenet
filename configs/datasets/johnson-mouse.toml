# johnson-mouse (TRACKED): 24 keypoints, one animal, 16 calibrated cameras at 3208x2200.
#
# The dense machine-derived counterpart of `johnson-mouse-annotated` (built from the hand-
# annotated `johnson-mouse/merge` JSON): same rig, same 24 names; a consistency target, not
# ground truth.
#
# `names` is in the npz's own (name-sorted) order, NOT the anatomical order the annotated root
# uses, because convert_v4.build_labels indexes `pose` positionally against this list. No name is
# a prefix of another, so the allen `npz_column_sorted` repair does not apply -- do not add it.
#
# `Snout` and `TailTip` are all-NaN in all three trials; they stay so the pose axis stays 24 wide.
name = "johnson-mouse"
out_name = "johnson-mouse-tracked"
mode = "3d"
units = "mm"
names = [
  "AnkleL", "AnkleR", "EarL", "EarR",
  "ElbowL", "ElbowR", "FootL", "FootR",
  "HandL", "HandR", "KneeL", "KneeR",
  "Neck", "ShoulderL", "ShoulderR", "Snout",
  "SpineL", "Tail1Q", "Tail3Q", "TailBase",
  "TailMid", "TailTip", "WristL", "WristR",
]

# Lifted verbatim from the source annotation JSON; both lists are name-indexed, so the ordering difference above does not affect them.
skeleton = [
  ["Snout", "EarL"],
  ["Snout", "EarR"],
  ["EarL", "Neck"],
  ["EarR", "Neck"],
  ["Neck", "SpineL"],
  ["SpineL", "TailBase"],
  ["Neck", "ShoulderL"],
  ["ShoulderL", "ElbowL"],
  ["ElbowL", "WristL"],
  ["WristL", "HandL"],
  ["Neck", "ShoulderR"],
  ["ShoulderR", "ElbowR"],
  ["ElbowR", "WristR"],
  ["WristR", "HandR"],
  ["SpineL", "KneeL"],
  ["KneeL", "AnkleL"],
  ["AnkleL", "FootL"],
  ["SpineL", "KneeR"],
  ["KneeR", "AnkleR"],
  ["AnkleR", "FootR"],
  ["TailBase", "Tail1Q"],
  ["Tail1Q", "TailMid"],
  ["TailMid", "Tail3Q"],
  ["Tail3Q", "TailTip"],
]

