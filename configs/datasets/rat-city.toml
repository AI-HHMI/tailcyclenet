# rat-city: 12 rats, ONE overhead camera, 4 keypoints, 4696x2048 frames.
#
# `names` is sourced from posetail_preprocessing/datasets/rat_city.py::KEYPOINTS; the npz carries
# no `keypoints` array, so this provenance comment IS the check_npz verification.
#
# CAVEAT: rat-city/train is a SINGLE trial (57594 frames), so every rat-city number is
# within-session by construction.
name = "rat-city"
mode = "2d"
units = "px"
image_wh = [4696, 2048]
# THE ONLY DATASET THAT IS NOT A SQUARE 416 DETECTOR INPUT -- the frame is 2.29:1. The square
# default letterbox pads 56% of the canvas and shrinks the median rat to ~2 x 1.6 cells at the
# finest FPN stride, unrepresentable at the other two. 896x384 matches the aspect ratio with
# ~1.7% padding, putting the median rat in the regime the fly detector already works in. Kept
# out of `sha`: it is a detector input size, not part of the keypoint table.
names = [
  "nose", "left_ear", "right_ear", "tail_base",
]

skeleton = [
  ["nose", "left_ear"],
  ["nose", "right_ear"],
  ["left_ear", "tail_base"],
  ["right_ear", "tail_base"],
]

flip_pairs = [
  ["left_ear", "right_ear"],
]

# Measured from the best checkpoint of this dataset's longest run. See DatasetSpec.
