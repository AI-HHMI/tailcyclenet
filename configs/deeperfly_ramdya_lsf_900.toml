# Bundle adjustment: the fly itself is the target. Solved with
# scipy.optimize.least_squares; its kwargs (max_nfev, loss, f_scale, ...) sit
# directly in this table.
[bundle_adjustment]
# Skeleton point names (from [skeleton].point_names) that drive bundle adjustment.
# The leg joints sit at sharp limb corners and detect most reliably, so the
# default uses the 30 leg points only. Omit this key to bundle-adjust on all keypoints.
points_to_use = [
    "lf_thorax_coxa", "lf_coxa_trochanter", "lf_femur_tibia", "lf_tibia_tarsus", "lf_claw",
    "lm_thorax_coxa", "lm_coxa_trochanter", "lm_femur_tibia", "lm_tibia_tarsus", "lm_claw",
    "lh_thorax_coxa", "lh_coxa_trochanter", "lh_femur_tibia", "lh_tibia_tarsus", "lh_claw",
    "rf_thorax_coxa", "rf_coxa_trochanter", "rf_femur_tibia", "rf_tibia_tarsus", "rf_claw",
    "rm_thorax_coxa", "rm_coxa_trochanter", "rm_femur_tibia", "rm_tibia_tarsus", "rm_claw",
    "rh_thorax_coxa", "rh_coxa_trochanter", "rh_femur_tibia", "rh_tibia_tarsus", "rh_claw",
]
fixed = [
    "*.intr",       # keep all intrinsics fixed
    # "f.rvec",     # anchor the front camera's orientation ...
    # "f.tvec",     # ... and position (fixes the world gauge)
    # "rm.tvec[2]",
]
shared = [] # e.g., [["lf.tvec[2]", "rf.tvec[2]"]] to tie the cameras' z distances together
weigh_by_confidence = false # whether keypoints with higher detector confidence get more weight
max_frames = 100            # bundle-adjust on at most this many frames (subsampled from the recording)
frame_sampling = "even"     # which frames to keep when subsampling:
                            #   even       - evenly spaced over the recording (default; temporal spread)
                            #   confidence - the highest-confidence frame in each time bin
                            #                (uses detector confidence; independent of weigh_by_confidence)
                            #   coverage   - the frame in each time bin with the most
                            #                keypoints seen by >= 2 cameras (best-conditioned)
                            #   diversity  - frames whose postures are most spread apart, so the
                            #                target is seen in many distinct configurations
max_nfev = 2000             # forwarded to scipy.optimize.least_squares
loss = "linear"


# Pictorial structures: DeepFly3D-style peak recovery over the detector's top-K
# candidates before triangulation. The candidates are extracted during detection
# and cached when this stage is on -- enabling it on an existing output dir
# re-runs pose2d once; afterwards, tweaking temporal/lam reuses the cached
# candidates without re-detecting.
[pictorial_structures]
k = 5                    # candidate peaks per joint
temporal = false         # add a temporal-consistency term
lam = 1.0                # bone-length prior weight


# Triangulation: how the per-view 2D points become one 3D point.
[triangulation]
weigh_by_confidence = false # whether keypoints with higher detector confidence get more weight
method = "dlt"              # ransac - largest multi-view consensus (default, robust)
                            # greedy - drop the worst-reprojecting view
                            # dlt    - plain least-squares, no outlier handling
ransac_threshold = 15.0     # inlier reprojection cutoff (px) for method = ransac
min_inliers = 2             # min agreeing views to accept a point (ransac)
# reproj_threshold = 40.0   # method = greedy: per-view reprojection cutoff (px)
# max_drops = 5             # method = greedy: max views dropped per offending point


# ---------------------------------------------------------------------------
# Visualization: each [[visualization.videos]] is one output MP4
# (`<video_name>.mp4`), composited from an ordered list of `panels`. A panel draws
# one `plot` op for one `view` (camera) with its top-left at pixel (`x0`, `y0`):
#   imshow      - that view's video frame
#   skeleton_2d - that view's 2D detections
#   skeleton_3d - the 3D skeleton reprojected into that view (OpenCV, depth-sorted)
# Panels draw in order, so a skeleton panel after an `imshow` at the same offset
# overlays it. The canvas auto-sizes to fit all panels unless you set
# `width`/`height` on the video.
#
# `background` is the canvas fill (default black): set it under `[visualization]`
# for every video, or per panel to repaint just its tile.
#
# Output frame rate: set `output_fps` (explicit fps) or `speed` (output fps = input
# fps * speed; 0.5 = slow motion) -- globally or per video, the per-video value
# winning. With neither, a video plays at the recording's own detected rate.
#
# Draw-op kwargs (point_radius, line_thickness, scale, palette, ...) merge across
# three levels, each keyed by the `plot` op name, most specific winning:
# `[visualization.kwargs]` (every video), a `kwargs` table on a video entry (that
# video), and extra keys on a single panel.
#
# Instead of `scale`, give a target `width` and/or `height` in pixels (settable at
# any level, priority over `scale`): both -> that exact box, one -> the other
# follows to keep aspect.
# ---------------------------------------------------------------------------
[visualization]
background = "black"
# Output MP4s are encoded with PyAV (H.264 / libx264, on the CPU).
# output_fps = 30        # explicit output fps for every video (per-video override below)
# speed      = 1.0       # or scale the input video fps instead (0.5 = slow motion)

[visualization.kwargs]
imshow      = { width = 480, height = 240 }
skeleton_2d = { line_thickness = 2, width = 480, height = 240 }
skeleton_3d = { line_thickness = 2, width = 480, height = 240 }

[[visualization.videos]]
video_name = "pose2d"   # camera frames with the raw 2D detections drawn on top
panels = [
    { plot = "imshow",      view = "f",  x0 = 240, y0 = 0   },
    { plot = "skeleton_2d", view = "f",  x0 = 240, y0 = 0   },
    { plot = "imshow",      view = "rf", x0 = 0,   y0 = 240 },
    { plot = "skeleton_2d", view = "rf", x0 = 0,   y0 = 240 },
    { plot = "imshow",      view = "lf", x0 = 480, y0 = 240 },
    { plot = "skeleton_2d", view = "lf", x0 = 480, y0 = 240 },
    { plot = "imshow",      view = "rm", x0 = 0,   y0 = 480 },
    { plot = "skeleton_2d", view = "rm", x0 = 0,   y0 = 480 },
    { plot = "imshow",      view = "lm", x0 = 480, y0 = 480 },
    { plot = "skeleton_2d", view = "lm", x0 = 480, y0 = 480 },
    { plot = "imshow",      view = "rh", x0 = 0,   y0 = 720 },
    { plot = "skeleton_2d", view = "rh", x0 = 0,   y0 = 720 },
    { plot = "imshow",      view = "lh", x0 = 480, y0 = 720 },
    { plot = "skeleton_2d", view = "lh", x0 = 480, y0 = 720 },
]

[[visualization.videos]]
video_name = "pose3d"   # same montage with the triangulated 3D skeleton reprojected back
panels = [
    { plot = "imshow",      view = "f",  x0 = 240, y0 = 0   },
    { plot = "skeleton_3d", view = "f",  x0 = 240, y0 = 0   },
    { plot = "imshow",      view = "rf", x0 = 0,   y0 = 240 },
    { plot = "skeleton_3d", view = "rf", x0 = 0,   y0 = 240 },
    { plot = "imshow",      view = "lf", x0 = 480, y0 = 240 },
    { plot = "skeleton_3d", view = "lf", x0 = 480, y0 = 240 },
    { plot = "imshow",      view = "rm", x0 = 0,   y0 = 480 },
    { plot = "skeleton_3d", view = "rm", x0 = 0,   y0 = 480 },
    { plot = "imshow",      view = "lm", x0 = 480, y0 = 480 },
    { plot = "skeleton_3d", view = "lm", x0 = 480, y0 = 480 },
    { plot = "imshow",      view = "rh", x0 = 0,   y0 = 720 },
    { plot = "skeleton_3d", view = "rh", x0 = 0,   y0 = 720 },
    { plot = "imshow",      view = "lh", x0 = 480, y0 = 720 },
    { plot = "skeleton_3d", view = "lh", x0 = 480, y0 = 720 },
]
