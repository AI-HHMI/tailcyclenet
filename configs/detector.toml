# The detector training config (`scripts/train_detector.py --config configs/detector.toml`).
# One shipped recommended recipe. Per-root differences are key overrides in YOUR config, not a
# second shipped file -- `extends` works one level deep. The recall-v2 assignment/loss defaults
# below are the selected rat-city training recommendation; set assignment="center" and
# box_loss="giou" explicitly only when reproducing a legacy control.
#
# Blocks: [data] (loader + regression target), [model] (architecture), [training] (schedule).
# An UNKNOWN KEY IN ANY BLOCK RAISES -- a typo must not silently train at defaults.
# The cosine schedule itself is not configurable; it never was a flag. `weight_decay` IS a config
# key (added post-report-42); its code-level fallback for an absent key is 5e-4 (the old hardcoded
# value, byte-identical), but THIS FILE's own shipped value is 0.01 -- see the key's own comment.

[data]
# ONE dataset root (train/, optionally val/ and test/); a folder whose children are roots is refused.
path = ""

# Regression target: `instances` (instances.pq extent, matching LoaderConfig.box_source) or `keypoints` where the shipped boxes disagree with the crop rule (calms21, johnson-mouse).
boxes = "instances"

# Must equal the pose run's [data].min_crop_dim -- same crop rule; infer.py refuses a mismatch.
min_crop_dim = 64

# Explicit input size, overriding min_box_px entirely; omit (or []) to use min_box_px.
input_wh = []

# Raise input size until the MEDIAN animal is this many detector pixels across -- a floor only; 0 restores the plain 416^2 budget. Measured to keep paying past 32.
min_box_px = 32

# Ceiling on min_box_px -- the difference between a rule and a blank cheque; reported when it applies.
max_input_px = 692224

# `frames_per_group` IS DELETED (raises as an unknown key): the TRAIN loader indexes EVERY labelled frame and draws view-uniformly within a cohort. The cap froze a random subsample for the whole run and set the cohort mix as a side effect.

# A one-group dataset scores one group's worth of val (default 8) -- raise it to the group's labelled length. TRAIN-side only was deleted; val/test keep the deterministic cap.
val_frames_per_group = 8

# cohort share (probability a train draw comes from an `annotated` session, vs `tracked`); DEFAULTS TO 0.6 PER USER INSTRUCTION, NOT A MEASURED VALUE -- a moderate, root-independent middle ground, not any one root's old implicit `frames_per_group=40` ratio (those varied wildly: ~96% annotated on rat-city-combined, ~39% on allen-mouse-combined, ~100% on johnson-mouse-combined-aug -- see dev/plans/detector_iteration_budget.md's own table). Inert on single-cohort splits (3dpop, calms21, branson-fly). Still group-uniform WITHIN each cohort under the frames_per_group fix, so this differs from any of those old ratios even where the NUMBER matches: the tracked cohort's share now spans its full frame pool instead of a frozen subsample.
annot_frac = 0.6

# random similarity + brightness on TRAIN; read the train/val gap first.
augment = true

# Strong appearance/erasure/mosaic-lite suite on top of augment (color jitter, noise, blur, cutout, mosaic-lite); ON BY DEFAULT PER USER INSTRUCTION, not evidence.
augment_strong = true

# random in-plane rotation (+-DEG per visit); 0 is off, byte-identical. DEFAULTS TO 45 PER USER INSTRUCTION, NOT EVIDENCE.
rotate_deg = 45.0

# decode JPEGs at 1/N via libjpeg where the frame is far above the letterbox target; stored in the checkpoint; no effect on a video root.
reduce = false

# train a bottom-up KEYPOINT BRANCH beside the box head; off means NOT CONSTRUCTED (byte-identical to every recorded detector), and on also disables the horizontal flip.
keypoints = false

# the horizontal flip in the augmentation; exists for the box-only control arm (`keypoints = true` disables it implicitly).
hflip = true

# train on TILES of this size in INPUT pixels (SOURCE extent = tile_wh / tile_scale); empty = whole frames, byte-identical; its ONE justification is use_regions.
tile_wh = []

# source -> input scale for tile_wh (1.0 = native). DO NOT ALSO RESIZE THE TILE: the invariant is the animal's size in INPUT pixels.
tile_scale = 1.0

# background tiles per frame, centres inside the certified area
tile_bg_per_frame = 1

# mask the objectness loss to the area regions.pq certifies as completely labelled; measured DEAD on whole frames -- use it WITH tiles; UNDEFINED under augment_strong.
use_regions = false

# mask instances.pq PRESENT boxes (in-view but unannotated) out of the objectness BACKGROUND target; OPPOSITE polarity from use_regions and MUTUALLY EXCLUSIVE with it. SHIPPED OFF.
ignore_present = false

[model]
# the ARCHITECTURE, recorded in the checkpoint (absent means `trimmed`, byte-identical to every recorded detector). DEFAULTS TO `hybrid` (CNN backbone + a from-scratch ViT stage + Simple Feature Pyramid) -- confirmed the detector-architecture-sweep winner (report 47): large wins on rat-city-combined and allen-mouse-combined, ties elsewhere, no significant loss on any of the 6 training roots. `tiny` (COCO-pretrained) is the prior default, still available by name.
yolox = "hybrid"

# stride-4 (P2) FPN level on top of either tier; DEFAULTS TO true (confirmed on 3dpop at both seeds); false restores the 3-level FPN, byte-identical to every checkpoint on record.
p2 = true

[training]
# run folder: checkpoints, metrics.json, effective config.toml + provenance.toml; overridden by `--out` on the command line.
out = ""

# total iterations; prefer the FINAL checkpoint for arm-vs-arm (best-on-val iteration varies widely across identical recipes).
iters = 20000

# DEFAULTS TO 8 PER USER INSTRUCTION, NOT A MEASURED VALUE -- lower memory headroom for smaller GPUs (16 GB class): the hybrid recipe's worst-case root (3dpop, the largest resolved input of the six at 736x448) measured ~21.1 GB at batch_size=16 on an L4's 23 GB, an ESTIMATE (not measured) that batch_size=8 would land around 10-12 GB. Was 16.
batch_size = 8
# STAYS AT 1e-3: a short-run win for 6e-4 was REVERSED at full length; do not re-propose a lower `lr` off short-run numbers.
lr = 1e-3
num_workers = 8
seed = 23
# model init, augmentation draws and the train shuffle order; a same-recipe replicate (different seed) is not optional before trusting a detector arm.
device = "cuda:0"

eval_every = 2000
# batches per split at each checkpoint; TRAIN is scored too -- the train/val gap says augmentation (a gap) or resolution (no gap, low absolute recall).
eval_batches = 25

kpt_weight = 1.0
kpt_score_weight = 1.0

# Task-aligned assignment (TAL) -- the recommended Wave-0 TAL+CIoU recipe; `center` restores the legacy centre-prior assignment.
assignment = "tal"

# Box regression loss: CIoU (paired with TAL in the recommended recipe); `giou` restores the legacy control.
box_loss = "ciou"

# per-GT positive-anchor cap (k closest anchors by centre distance); DEFAULTS TO 10 (confirmed at both seeds); 0 restores uncapped, byte-identical.
max_pos_per_gt = 10

# the BCE objectness target at a positive anchor becomes the DETACHED IoU (past iou_aware_warmup) instead of hard 1.0; DEFAULTS TO true -- fixes objectness saturation, giving `--det-score` a live range.
iou_aware_obj = true
iou_aware_warmup = 2000

# weight on the GIoU box term (formerly a hardcoded constant -- 5.0); DEFAULTS TO 15.0, the only lever to survive a full-length confirmation AND a same-recipe replicate.
box_weight = 15.0

# AdamW's DECOUPLED weight decay (p <- p*(1 - lr*wd)); SHIPPED 0.01 PER USER INSTRUCTION, NOT A CONFIRMED WIN (report 42: real but MIXED trade-off, one seed, never replicated); absent-key fallback stays 5e-4, byte-identical.
weight_decay = 0.01

# the detector-architecture-sweep winning recipe (report 47), confirmed against a matched-iteration tiny+COCO control on all 6 training roots: separate obj/reg head towers (not shared), bilinear FPN upsampling, and a wider TAL positive-anchor pool. Ship together -- measured as one recipe, not swept independently past Wave 1.
shared_head = false
fpn_upsample = "bilinear"
tal_topk = 20

# DEFAULTS TO `muon` PER USER INSTRUCTION (consistency with the pose side), NOT YET EVIDENCE for THIS pairing: Wave 0 (report 47) found adamw beat muon clearly, but only on the `tiny` CNN backbone (few/no 2D weight matrices for Muon to route) -- untested against `hybrid`'s ViT stage, which has plenty. A same-protocol muon-vs-adamw recheck on hybrid is running now (`dev/scratch/optsweep/`); roll this back to `adamw` if it comes back significantly worse.
optimizer = "muon"
