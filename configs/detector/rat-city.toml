# rat-city: ONE val group, 64 labelled frames. Raised to the group's own labelled length -- the
# shipped 8 made checkpoint selection see only 12.5% of the val evidence, on the root whose whole
# test split is also one group. Watch `eval_every` if eval time becomes the bottleneck.
#
# `[data].boxes` stays at the base default ("instances") deliberately: instance-trained beat
# keypoint-trained on rat-city, but every SHIPPED rat-city POSE run is keypoint-trained, so this
# pair serves two different crop rules and any delta off it is not detector accuracy alone until
# that is resolved on the pose side.

extends = "../detector.toml"

[data]
path = "/groups/karashchuk/karashchuklab/animal-datasets-processed/tailcycle-datasets/rat-city"
val_frames_per_group = 64

[training]
out = ""
