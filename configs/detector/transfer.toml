# Cross-rig detector recipe: a detector meant to find the animal on a rig it was never trained on.
# Measured in dev/reports/73_detector_transfer_wave1.md (plan dev/plans/detector_transfer.md) on two
# source-only transfer pairs, each at two seeds, 8k iterations: qdmouse -> allen cost (miss +
# fp/view) 1.81/1.50 -> 0.96/0.85, allen -> johnson 1.84/1.89 -> 0.91/1.14. The price is in-domain:
# allen's own val miss 0.012/0.036 -> 0.071/0.071 (6 of 84 views); qdmouse's own val stays 0.
#
# Not the shipped default (configs/detector.toml): that would move every detector from the hybrid
# (report 47's in-domain winner) to COCO yolox-m on the evidence of three mouse roots.
#
# Use: copy this file, set [data].path. The training roots need estimated backgrounds first
# (`scripts/estimate_backgrounds.py --data <root>`, writes ~/.cache/tailcyclenet/backgrounds/<root>/;
# the bank REFUSES a training root without them) and the generic image pack
# (`scripts/build_generic_backgrounds.py`). Only the TRAINING roots' backgrounds are ever read.

[data]
path = ""
boxes = "keypoints"
# luma histogram equalisation, train AND deploy (in the checkpoint); qdmouse->allen 1.37 -> 0.92 with it.
input_norm = "equalize"
# photometric negative: coat colour / lighting flip contrast polarity across rigs
invert_prob = 0.15
# random zoom range of the similarity (base 0.8-1.25)
scale_range = [0.55, 1.4]
# paste the view's animals onto own empty-arena estimates / generic pack / procedural canvases (0.4/0.3/0.3)
background_prob = 0.25
background_own = "~/.cache/tailcyclenet/backgrounds"
background_generic = "~/.cache/tailcyclenet/generic_backgrounds_v1"

[model]
# COCO pretraining alone moved qdmouse->allen; m beat tiny and s under the same augmentation.
yolox = "m"
pretrained = "coco"
bottleneck_expansion = 1.0

[training]
# LONGER IS WORSE FOR TRANSFER: the tiny compound at 16k lost 0.17 on both pairs vs 8k.
iters = 8000
out = ""
