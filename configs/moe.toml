# The v7 pose model (MX0e, report 76 crowd-moe): the box-FiLM model (E1) plus the anchored set
# decoder (E2) on detached scene tokens, contact-routed at deploy. Layers over configs/base.toml.
# 2D or 3D roots (3D: E2 = PBM4's 4-query recipe); deploy: --box-prompt detector, 2D --no-refine.

[data]
hard_frac = 0.5

[model]
set_decoder = true
