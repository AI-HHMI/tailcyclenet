# The default arm. Hand-written: configs are not generated here and there is not one per
# experiment. Copy this file and change what you mean to change.
#
# [model] below the `query` line is the ukt14i7c base recipe verbatim -- it is splatted into
# posetail's TrackerEncoder, and the warm start expects to find the same architecture it was
# trained with. `n_keypoints` is NOT here: it is derived from the keypoint registry, which is
# derived from the data.

[data]
# A dataset root (has train/, optionally val/ and test/) OR a folder of dataset roots. The
# second case trains one estimator across all of them, prefixing keypoint names by dataset.
path = "/groups/karashchuk/karashchuklab/animal-datasets-processed/tailcycle-datasets/allen-mouse"
n_frames = 24               # a CEILING: a train window is sized to the labelled span it covers
image_size = 256
cams_to_sample = 0          # 0 -> every camera of a 3D session
prob_2d_only = 0            # 3D single-view has no triangulation, so a non-query point has
                            # nothing to predict there and leaves the 3D target. Off by default:
                            # golden spent 0% of its steps on this path.
balance_datasets = true
aug_prob = 0.25
crop_jitter = 0.3           # 0.3/0.3 cut the cost of detector crops from +0.545 to +0.115 mm
crop_jitter_scale = 0.3     # AND improved base accuracy -- a tight box teaches the model that
min_crop_dim = 64           # the animal always fills the frame, which no detector delivers
prompt_dropout = 0.5        # fraction of STEPS run fully query-free -> no-query tokens
prompt_noise_px = 3.0       # sigma on the prior, in PIXELS. 3D converts via cube_scale (world
                            # units per pixel), the same normalisation the metric losses use, so
                            # ONE setting means the same visual displacement on a 30 px fly and on
                            # allen's mm-space rig. Trained on exact GT the prior learns to trust a
                            # precision the carried signal lacks: on rat-city the (0,0) control had
                            # carry HURT +1.815 where the recipe row had it HELP -0.749. Ships WITH
                            # the dropout -- dropout alone is retired at +0.146 SIG worse on fly.
num_workers = 12

[model]
query = "prior"             # "prior" (per-keypoint prior + no-query tokens) | "none" (query-free)
query_encoder = "wide"      # "wide" (512-dim, identity + time + the two query terms,
                            # which are built iff query = "prior") | "pose" (256-dim, ten)
gridresid_offset = "query"  # what the 3D residual is an offset FROM. "query": the library's
                            # native structure, kept per keypoint only where a real prior anchored
                            # it, triangulation elsewhere, direct head supervised on query points
                            # only. "triangulated": recover the residual and re-add it to EACH
                            # frame's own triangulation for every keypoint (2.07 -> 1.37 mm in
                            # posetail-pose) -- the pairing that rescues a scene-centre anchor.

mode_3d = "encoder"
video_encoder_version = "large"
video_encoder_requires_grad = false
video_encoder_hierarchical = true
soft_argmax_temperature_learnable = true
stride_length = 24
image_size = 256
query_patch_size = 9
per_camera_cube_scale = true
max_freq = 10
embedding_dim = 256
use_volume_embedding = false
corr_radius = 2
principal_point_embedding = true
intrinsic_embedding = true
metric_ray_translation = true
occlusion_embedding = true
latent_dim = 512
n_heads = 8
n_time_space_blocks = 6
embedding_factor = 4
use_camera_self_attention = true
use_temporal_self_attention = true
f_eff_scale = true
scene_encoder_proj = true
cross_attn_dim = 512
scene_proj_dim = 512
scene_proj_prenorm = false
scene_proj_mlp = false
scene_pos_embed_mode = "ropepos"
rope_base = 100.0
time_embed_mode = "fourier_rel"
output_mode = "gridresid"
head_3d_grid_size = 1024
head_3d_grid_radius = 1.8
log_3d_output = true
log_3d_eps = 0.1
soft_argmax_threshold = 60
grid_decode_space = "warped"
enable_subpixel_refinement = false
depth_log_min = -2.5
depth_log_max = 2.5

[training]
out = "runs/w9"
n_iterations = 30000
seed = 0
# The base tracker this finetunes from. Moving-camera support added ZERO parameters, so a
# checkpoint from before that merge loads cleanly; the unexpected-keys list is printed anyway.
checkpoint_path = "/groups/karashchuk/home/karashchukl/results/posetail-finetuning-v3/wandb/run-20260727_113457-ukt14i7c/files/checkpoints"
max_grad_norm = 10.0
checkpoint_freq = 1000
val_freq = 200
val_batches = 20
print_freq = 20
freeze_encoder = true       # a DEPLOYMENT decision: one frozen encoder forward feeds both models

[training.optimizer]
learning_rate = 1e-4        # what every hop of the golden chain actually ran
kpt_lr = 5e-4               # fresh params (identity table, no-query tokens, gate) learn faster
encoder_lr_scale = 0.1
weight_decay = 0.002
warmup_steps = 500
beta1 = 0.9
beta2 = 0.95

[training.losses]
gamma = 0.8
pixel_thresh = 3
delta = 6
use_huber_loss = true
vis_loss_weight = 5.0
vis_loss_3d_weight = 1.0
conf_loss_weight = 0.0
conf_2d_loss_weight = 0.0
occluded_coords_loss_weight = 0.1
feature_loss_weight = 0.0
coords_loss_weight = 0.1
coords_loss_direct_weight = 0.1
coords_loss_rays_weight = 0.0
coords_loss_triangulate_weight = 0.1
coords_loss_2d_weight = 1.5
coords_loss_depth_weight = 0.5
coords_loss_direct_reproj_weight = 1.0
coords_loss_rays_reproj_weight = 0.05
coords_loss_triangulate_reproj_weight = 2.0
coords_softmax_2d_weight = 0.6
coords_softmax_3d_weight = 0.4
depth_softmax_weight = 1.5
coords_3d_loss_scale = 50.0
smoothness_loss_3d_weight = 0.5
smoothness_loss_2d_weight = 0.5
smoothness_loss_order = 4
smoothness_loss_tolerance = 1.5

[wandb]
project_name = "tailcyclenet"
path = "/groups/karashchuk/home/karashchukl/results/tailcyclenet"
mode = "offline"
