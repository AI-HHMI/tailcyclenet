# Bundle adjustment: the fly itself is the target. Solved with
[bundle_adjustment]
# Skeleton point names (from [skeleton].point_names) that drive bundle adjustment.
points_to_use = [
    "lf_thorax_coxa", "lf_coxa_trochanter", "lf_femur_tibia", "lf_tibia_tarsus", "lf_claw",
    "lm_thorax_coxa", "lm_coxa_trochanter", "lm_femur_tibia", "lm_tibia_tarsus", "lm_claw",
    "lh_thorax_coxa", "lh_coxa_trochanter", "lh_femur_tibia", "lh_tibia_tarsus", "lh_claw",
    "rf_thorax_coxa", "rf_coxa_trochanter", "rf_femur_tibia", "rf_tibia_tarsus", "rf_claw",
    "rm_thorax_coxa", "rm_coxa_trochanter", "rm_femur_tibia", "rm_tibia_tarsus", "rm_claw",
    "rh_thorax_coxa", "rh_coxa_trochanter", "rh_femur_tibia", "rh_tibia_tarsus", "rh_claw",
]
fixed = [
    "*.intr",       # keep all intrinsics fixed
# "f.rvec",     # anchor the front camera's orientation ...
]
shared = [] # e.g., [["lf.tvec[2]", "rf.tvec[2]"]] to tie the cameras' z distances together
weigh_by_confidence = false # whether keypoints with higher detector confidence get more weight
max_frames = 100            # bundle-adjust on at most this many frames (subsampled from the recording)
frame_sampling = "even"     # which frames to keep when subsampling:
# even       - evenly spaced over the recording (default; temporal spread)
max_nfev = 2000             # forwarded to scipy.optimize.least_squares
loss = "linear"


# Pictorial structures: DeepFly3D-style peak recovery over the detector's top-K
[pictorial_structures]
k = 5                    # candidate peaks per joint
temporal = false         # add a temporal-consistency term
lam = 1.0                # bone-length prior weight


# Triangulation: how the per-view 2D points become one 3D point.
[triangulation]
weigh_by_confidence = false # whether keypoints with higher detector confidence get more weight
method = "dlt"              # ransac - largest multi-view consensus (default, robust)
# greedy - drop the worst-reprojecting view
ransac_threshold = 15.0     # inlier reprojection cutoff (px) for method = ransac
min_inliers = 2             # min agreeing views to accept a point (ransac)
# reproj_threshold = 40.0   # method = greedy: per-view reprojection cutoff (px)


# Visualization: each [[visualization.videos]] is one output MP4
[visualization]
background = "black"
# Output MP4s are encoded with PyAV (H.264 / libx264, on the CPU).

[visualization.kwargs]
imshow      = { width = 480, height = 240 }
skeleton_2d = { line_thickness = 2, width = 480, height = 240 }
skeleton_3d = { line_thickness = 2, width = 480, height = 240 }

[[visualization.videos]]
video_name = "pose2d"   # camera frames with the raw 2D detections drawn on top
panels = [
    { plot = "imshow",      view = "f",  x0 = 240, y0 = 0   },
    { plot = "skeleton_2d", view = "f",  x0 = 240, y0 = 0   },
    { plot = "imshow",      view = "rf", x0 = 0,   y0 = 240 },
